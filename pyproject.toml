[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdwan-lab"
version = "0.1.0"
description = "Reproducible three-link SD-WAN forecasting and guarded path selection lab"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2,<3", "xgboost>=3.0,<4", "scikit-learn>=1.6,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "matplotlib>=3.10,<4",
  "pyyaml>=6,<7", "cryptography>=45,<51",
  "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
lab = ["pymongo>=4.10,<5", "aiosmtpd>=1.4,<2", "websocket-client>=1.8,<2"]

[project.scripts]
sdwan = "sdwan.cli:main"

[tool.setuptools.packages.find]
include = ["sdwan*", "lab", "lab.edge"]

[tool.setuptools.package-data]
sdwan = ["openapi_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
