apiVersion: 1
datasources:
  - name: SD-WAN TimescaleDB
    uid: sdwan-timescale
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: sdwan_reader
    isDefault: true
    editable: false
    jsonData:
      database: sdwan
      postgresVersion: 1700
      timescaledb: true
      timeInterval: 5s
      maxOpenConns: 5
      maxIdleConns: 2
      sslmode: verify-full
      tlsConfigurationMethod: file-path
      sslRootCertFile: /certs/ca.crt
    secureJsonData:
      password: $SDWAN_READER_PASSWORD
